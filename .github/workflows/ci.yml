name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with 100% coverage gate
        run: |
          pytest tests/ \
            --cov=pain001_loader_mt101 --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: python benches/bench_parse_mt101.py --quick

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml pain001_loader_mt101

      # The scaling guard in tests/test_benchmarks.py compares the parser
      # against itself at two sizes, so it is not sensitive to how fast
      # this runner happens to be. --benchmark-json keeps the measurement
      # as an artifact so the trend is visible release over release.
      - name: Benchmarks and scaling guard
        run: |
          mkdir -p .benchmarks
          pytest tests/test_benchmarks.py -v --no-cov \
            --benchmark-json=.benchmarks/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-py${{ matrix.python-version }}
          path: .benchmarks/

      - name: Run examples end-to-end
        run: |
          for example in examples/*.py; do
            echo "--- $example ---"
            python "$example"
          done

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check pain001_loader_mt101/ tests/ examples/ benches/ scripts/

      # xlsx enforces this and this repo did not, so four files had
      # drifted out of format without anything noticing.
      - name: Ruff format check
        run: ruff format --check pain001_loader_mt101/ tests/ examples/ benches/ scripts/

      - name: Mypy
        run: mypy pain001_loader_mt101/
