name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-pinned install (OpenSSF Scorecard Pinned-Dependencies). The
      # package itself installs with --no-deps on top of the pinned tree.
      - name: Install dependencies (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/test.txt
          pip install --no-deps -e .

      - name: Run tests with 100% coverage gate
        run: |
          pytest tests/ \
            --cov=pain001_loader_mt101 --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: python benches/bench_parse_mt101.py --quick

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml pain001_loader_mt101

      # The scaling guard in tests/test_benchmarks.py compares the parser
      # against itself at two sizes, so it is not sensitive to how fast
      # this runner happens to be. --benchmark-json keeps the measurement
      # as an artifact so the trend is visible release over release.
      - name: Benchmarks and scaling guard
        run: |
          mkdir -p .benchmarks
          pytest tests/test_benchmarks.py -v --no-cov \
            --benchmark-json=.benchmarks/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-py${{ matrix.python-version }}
          path: .benchmarks/

      - name: Run examples end-to-end
        run: |
          for example in examples/*.py; do
            echo "--- $example ---"
            python "$example"
          done

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install lint tools (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/lint.txt
          pip install --no-deps -e .

      - name: Ruff check
        run: ruff check pain001_loader_mt101/ tests/ examples/ benches/ scripts/ fuzz/

      # xlsx enforces this and this repo did not, so four files had
      # drifted out of format without anything noticing.
      - name: Ruff format check
        run: ruff format --check pain001_loader_mt101/ tests/ examples/ benches/ scripts/ fuzz/

      - name: Mypy
        run: mypy pain001_loader_mt101/ scripts/

  # The native advisory audit over every hash-pinned requirements file, so
  # a published advisory against pain001 or anything it pulls in fails the
  # pull request rather than waiting for a Dependabot alert.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pip-audit (hash-pinned)
        run: pip install --require-hashes -r requirements/audit.txt

      - name: pip-audit
        run: |
          for f in requirements/*.txt; do
            echo "--- $f ---"
            pip-audit --progress-spinner off --require-hashes --disable-pip -r "$f"
          done

  # Per function: cyclomatic <= 10, cognitive <= 15, Halstead difficulty
  # <= 30, <= 60 lines; <= 500 lines per file. Offenders that predate the
  # gate live in complexity-baseline.json, which may only shrink. tests/
  # is not measured: test_suite_conformance.py is vendored from one
  # canonical copy and checksummed, so it cannot be edited here.
  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install radon and complexipy (hash-pinned)
        run: pip install --require-hashes -r requirements/complexity.txt

      - name: Complexity
        run: |
          python scripts/check_complexity.py
          complexipy pain001_loader_mt101 scripts benches examples fuzz --max-complexity-allowed 15 --quiet
